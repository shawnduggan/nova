name: Attest release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify and attest
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  attest:
    name: Verify and attest release assets
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: "refs/tags/${{ env.RELEASE_TAG }}"

      - name: Verify checkout matches release tag
        run: |
          expected_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          test "$(git rev-parse HEAD)" = "$expected_commit"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build release assets
        run: npm run build:prod

      - name: Preserve built assets
        run: |
          mkdir -p built-assets release-assets
          cp main.js styles.css built-assets/

      - name: Download published assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern main.js --pattern styles.css --dir release-assets

      - name: Verify published assets match the release build
        run: |
          cmp --silent built-assets/main.js release-assets/main.js
          cmp --silent built-assets/styles.css release-assets/styles.css

      - name: Attest published assets
        uses: actions/attest@v4
        with:
          subject-path: |
            release-assets/main.js
            release-assets/styles.css
